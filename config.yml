# LedgerMolty — moltbook-resident configuration
#
# No secrets here. All three keys come from the environment, so this file is
# safe to commit in a public repo:
#   MOLTBOOK_API_KEY   issued when the agent registers on Moltbook
#   AIOPS_QUERY_KEY    free consumer key from /dashboard/api-keys
#   ANTHROPIC_API_KEY  for composing posts and solving verification puzzles

agent_name: LedgerMolty

# Which community to post in. m/agents is where agent-accountability talk
# happens — it is where the first question about LedgerMolty came from.
# Subscribe and read for a week before creating
# your own — their rules discourage starting a submolt you won't maintain.
submolt: agents

# The ONLY URL this agent may ever publish. Leave blank until LedgerMolty's own
# listing exists; the profile line then omits the link rather than shipping a
# broken one, and the guard blocks every URL.
#   once imported:  https://aiopsenabler.com/agents/ledgermolty
record_url: "https://aiopsenabler.com/agents/ledger-molty?ref=moltbook"

enabler:
  # The API host. NOT the website — a single-page frontend answers 200 with
  # HTML for unknown paths, so a wrong value here looks like success until
  # something tries to parse it. `--describe-api` probes for the right one.
  base_url: https://api.aiopsenabler.com
  path_template: "/api/v1/query/agents/{slug}"

  # The agents LedgerMolty keeps the record for. Must be PUBLISHED listings —
  # drafts are not visible to the Query API. Add more as you publish them.
  fleet:
    - dns-drift
    - cert-sentinel

  # Env var holding the free consumer API key. Never put the key itself here.
  key_env: AIOPS_QUERY_KEY

posting:
  enabled: true
  period: day        # day | week — one post per period, enforced by the ledger
  min_runs_to_post: 1

replies:
  # off    — never look at replies at all
  # draft  — classify and draft, write to a file, publish nothing (RECOMMENDED)
  # auto   — publish drafts that pass the guard
  #
  # Stay on draft for the first month. You can't guess now what people will
  # ask, and reading real drafts costs nothing.
  mode: draft
  max_per_run: 5

# Outreach: answer open questions about verifying agent reliability that we find
# via search — threads we were NOT tagged in. This is the highest-risk feature
# in the repo: a reply in a thread that genuinely asked is a contribution, a
# reply anywhere else is spam, and spam from this account destroys the only
# thing it has. It is built to fail closed and is DISABLED by default. Read a
# run's outreach log (printed to stdout) before turning it on.
outreach:
  enabled: false            # turn on yourself, after reading the log
  max_per_day: 1            # hard cap across all queries — never raise it
  max_age_hours: 48         # never reply to old threads
  max_existing_comments: 8  # don't pile onto a busy thread
  queries:
    - "verify an agent"
    - "agent reliability"
    - "how do you measure agent"
    - "prove your agent works"
    - "trust an agent"
    - "agent success rate"

model:
  name: claude-sonnet-4-6
  max_retries: 2

state_path: state/resident.json
drafts_path: state/drafts.md
out: result.json
